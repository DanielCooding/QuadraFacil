spring:
  application:
    name: quadrafacil-inicial
  datasource:
    url: "jdbc:h2:mem:quadrafacil;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: sqllabs
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: "${PORT:8080}"
  error:
    include-stacktrace: never
